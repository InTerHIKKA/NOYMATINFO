<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Инструмент Шифрования — RSA & AES</title>
    <link rel="stylesheet" href="css/main.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('rsa')">RSA Инструмент</button>
                <button class="tab-btn" onclick="switchTab('aes')">AES Инструмент</button>
            </div>

            <div id="rsaTab" class="tab-content active">
                <h2>Зашифровать текст (RSA)</h2>
                <div class="form-group">
                    <input type="text" id="pVal" placeholder="Число p (напр. 61)">
                </div>
                <div class="form-group">
                    <input type="text" id="qVal" placeholder="Число q (напр. 53)">
                </div>
                <div class="form-group">
                    <input type="text" id="plainTextRSA" placeholder="Введите слово">
                </div>
                <button class="btn-encrypt" onclick="encryptRSA()">Зашифровать</button>

                <h2 style="margin-top: 25px;">Расшифровать числа (RSA)</h2>
                <div class="form-group">
                    <input type="text" id="cipherInputRSA" placeholder="Числа через запятую (напр. 12, 45, 8)">
                </div>
                <div class="hint">Для расшифровки используйте те же p и q выше</div>
                <button class="btn-decrypt" onclick="decryptRSA()">Расшифровать</button>

                <div id="outputBoxRSA" class="output-box">Здесь будет результат...</div>
            </div>

            <div id="aesTab" class="tab-content">
                <h2>Зашифровать текст (AES)</h2>
                <div class="form-group">
                    <input type="text" id="aesKey" placeholder="Секретный ключ (пароль)">
                </div>
                <div class="form-group">
                    <input type="text" id="plainTextAES" placeholder="Введите слово">
                </div>
                <button class="btn-encrypt" onclick="encryptAES()">Зашифровать</button>

                <h2 style="margin-top: 25px;">Расшифровать строку (AES)</h2>
                <div class="form-group">
                    <input type="text" id="cipherInputAES" placeholder="Зашифрованная строка Base64">
                </div>
                <div class="hint">Для расшифровки используйте тот же секретный ключ</div>
                <button class="btn-decrypt" onclick="decryptAES()">Расшифровать</button>

                <div id="outputBoxAES" class="output-box">Здесь будет результат...</div>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
